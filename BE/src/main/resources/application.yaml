server:
  port: ${PORT:8080}

google:
  client-id: ${GOOGLE_CLIENT_ID}

spring:
  application:
    name: phimium-be

  # Ảnh tour (thumbnail + gallery) upload qua multipart, mặc định Spring chỉ cho 1MB/file
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:10MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:60MB}

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

  jwt:
    secret-key: ${TOKEN_SECRET_KEY}
    expiration: 86400000
    refresh-expiration: 604800000

  jackson:
    time-zone: Asia/Ho_Chi_Minh

  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: ${BREVO_SMTP_LOGIN}
    password: ${BREVO_SMTP_KEY}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  mail:
    from: ${MAIL_FROM}

sepay:
  merchant-id: ${SEPAY_MERCHANT_ID}
  secret-key: ${SEPAY_SECRET_KEY}
  checkout-url: ${SEPAY_CHECKOUT_URL:https://pay.sepay.vn/v1/checkout/init}
  api-url: ${SEPAY_API_URL:https://pgapi.sepay.vn}
  success-url: ${SEPAY_SUCCESS_URL}
  error-url: ${SEPAY_ERROR_URL}
  cancel-url: ${SEPAY_CANCEL_URL}
  ipn-secret: ${SEPAY_IPN_SECRET:}

booking:
  hold-minutes: ${BOOKING_HOLD_MINUTES:15}

matching:
  result-minutes: ${MATCHING_RESULT_MINUTES:10}
  max-results: ${MATCHING_MAX_RESULTS:3}
  candidate-limit: ${MATCHING_CANDIDATE_LIMIT:12}
  buddy-limit: ${MATCHING_BUDDY_LIMIT:50}
  requests-per-minute: ${MATCHING_REQUESTS_PER_MINUTE:6}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    timeout-millis: ${GEMINI_TIMEOUT_MILLIS:20000}
    max-concurrent: ${GEMINI_MAX_CONCURRENT:4}

auth:
  cookie:
    secure: ${AUTH_COOKIE_SECURE:true}
    same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
