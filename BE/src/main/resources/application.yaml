server:
  port: ${PORT:8080}

google:
  client-id: ${GOOGLE_CLIENT_ID}

spring:
  application:
    name: phimium-be

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  jwt:
    secret-key: ${TOKEN_SECRET_KEY}
    expiration: 86400000
    refresh-expiration: 604800000

  jackson:
    time-zone: Asia/Ho_Chi_Minh

  mail:
    host: smtp-relay.brevo.com
    port: 587
    username: ${BREVO_SMTP_LOGIN}
    password: ${BREVO_SMTP_KEY}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  mail:
    from: ${MAIL_FROM}

sepay:
  merchant-id: ${SEPAY_MERCHANT_ID}
  secret-key: ${SEPAY_SECRET_KEY}
  checkout-url: ${SEPAY_CHECKOUT_URL:https://pay-sandbox.sepay.vn/v1/checkout/init}
  api-url: ${SEPAY_API_URL:https://pgapi-sandbox.sepay.vn}
  success-url: ${SEPAY_SUCCESS_URL}
  error-url: ${SEPAY_ERROR_URL}
  cancel-url: ${SEPAY_CANCEL_URL}
  ipn-secret: ${SEPAY_IPN_SECRET:}

booking:
  hold-minutes: ${BOOKING_HOLD_MINUTES:15}
